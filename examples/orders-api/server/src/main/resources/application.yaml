spring:
  application:
    name: example-orders-api-server

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

openapi:
  server:                                   # contract-first-server-starter
    base-path: /api/v1                      # path part of servers[0].url in the contract
    problem:
      type-namespace: https://orders.example.com/problems/
    api-key:
      accepted-keys:                        # static demo keys; in a real deployment inject from a secret store
        - dev-api-key-1
        - dev-api-key-2
  orders:                                   # the generator's own placeholder, derived from the spec title
    base-path: ${openapi.server.base-path}

logging:
  level:
    io.github.dmitrykislov: INFO
