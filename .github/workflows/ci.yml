name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Generate, compile, test (unit + integration + end-to-end)
        run: mvn -B --no-transfer-progress verify
      - name: Publish test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/target/surefire-reports/*.xml
            **/target/failsafe-reports/*.xml
            **/target/site/jacoco/jacoco.xml
          if-no-files-found: ignore

  contract-compatibility:
    # The spec is the product. A pull request may not change it incompatibly unless it bumps the major version.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      SPEC: examples/orders-api/spec/src/main/resources/openapi/orders-api.yaml
      OPENAPI_DIFF_VERSION: 2.1.7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Compare the contract with the base branch
        run: |
          set -euo pipefail
          git show "origin/${GITHUB_BASE_REF}:${SPEC}" > /tmp/base.yaml
          curl -sSL -o /tmp/openapi-diff.jar \
            "https://repo1.maven.org/maven2/org/openapitools/openapidiff/openapi-diff-cli/${OPENAPI_DIFF_VERSION}/openapi-diff-cli-${OPENAPI_DIFF_VERSION}-all.jar"
          major() { grep -E '^\s+version:' "$1" | head -1 | sed -E 's/.*version:\s*"?([0-9]+).*/\1/'; }
          BASE_MAJOR=$(major /tmp/base.yaml); HEAD_MAJOR=$(major "$SPEC")
          FLAG="--fail-on-incompatible"
          if [ "$BASE_MAJOR" != "$HEAD_MAJOR" ]; then
            echo "Major version changed ${BASE_MAJOR} -> ${HEAD_MAJOR}: incompatible changes are allowed."; FLAG=""
          fi
          java -jar /tmp/openapi-diff.jar /tmp/base.yaml "$SPEC" $FLAG --markdown /tmp/diff.md || STATUS=$?
          { echo "## Contract changes vs ${GITHUB_BASE_REF}"; cat /tmp/diff.md; } >> "$GITHUB_STEP_SUMMARY"
          exit "${STATUS:-0}"
